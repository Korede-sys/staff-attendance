<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Staff Check-In</title>
<link rel="manifest" href="/kiosk/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #38bdf8;
    --good: #22c55e;
    --bad: #f97316;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    padding: 20px 24px 10px;
    text-align: center;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  header #clock { color: var(--muted); font-size: 1rem; margin-top: 4px; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 18px;
    overflow-y: auto;
  }
  .tabs {
    display: flex;
    gap: 8px;
    background: var(--panel);
    padding: 6px;
    border-radius: 14px;
  }
  .tab {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: #0f172a; }

  .panel {
    width: 100%;
    max-width: 420px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .panel.active { display: flex; }

  #qr-video-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 320px;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    position: relative;
    border: 3px solid var(--panel);
  }
  #qr-video { width: 100%; height: 100%; object-fit: cover; }
  .scan-hint { color: var(--muted); text-align: center; font-size: 0.95rem; }

  .pin-card {
    width: 100%;
    background: var(--panel);
    border-radius: 18px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .field label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 1.3rem;
    text-align: center;
    letter-spacing: 2px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .keypad button {
    padding: 16px 0;
    border-radius: 12px;
    border: none;
    background: #0f172a;
    color: var(--text);
    font-size: 1.4rem;
    font-weight: 600;
  }
  .keypad button:active { background: #334155; }
  .submit-btn {
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #0f172a;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .submit-btn:active { opacity: 0.85; }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    z-index: 50;
  }
  #overlay.show { display: flex; }
  #overlay .icon { font-size: 4.5rem; }
  #overlay .name { font-size: 1.8rem; font-weight: 700; }
  #overlay .status { font-size: 1.3rem; font-weight: 600; }
  #overlay .detail { color: var(--muted); font-size: 1rem; }
  #overlay.on_time .status { color: var(--good); }
  #overlay.late .status { color: var(--bad); }
  #overlay.error .status { color: var(--bad); }

  footer {
    text-align: center;
    padding: 10px;
    font-size: 0.75rem;
    color: #475569;
    flex-shrink: 0;
  }
  footer a { color: #475569; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="org-name">Staff Check-In</h1>
    <div id="clock"></div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="qr">Scan QR</button>
      <button class="tab" data-tab="pin">Staff ID</button>
    </div>

    <div class="panel active" id="panel-qr">
      <div id="qr-video-wrap">
        <video id="qr-video" playsinline muted></video>
      </div>
      <div class="scan-hint">Hold your QR code up to the camera</div>
    </div>

    <div class="panel" id="panel-pin">
      <div class="pin-card">
        <div class="field">
          <label>Staff ID</label>
          <input id="staff-code" type="text" inputmode="numeric" readonly />
        </div>
        <div class="field">
          <label>PIN</label>
          <input id="staff-pin" type="password" inputmode="numeric" readonly />
        </div>
        <div class="keypad" id="keypad"></div>
        <button class="submit-btn" id="submit-pin">Check In</button>
      </div>
    </div>
  </main>

  <footer><a href="/admin">Admin</a></footer>
</div>

<div id="overlay">
  <div class="icon" id="overlay-icon"></div>
  <div class="name" id="overlay-name"></div>
  <div class="status" id="overlay-status"></div>
  <div class="detail" id="overlay-detail"></div>
</div>

<script src="/kiosk/qr-scanner.umd.min.js"></script>
<script src="/kiosk/app.js"></script>
</body>
</html>
